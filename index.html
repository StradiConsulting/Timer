<style>
:root{
  --paper:#EFF3F7; --panel:#FFFFFF; --panel-2:#F6F9FC;
  --ink:#172430; --muted:#637182; --faint:#97A3B2;
  --brand:#1C4C7C; --brand-700:#143A5F; --brand-300:#5B7E9E;
  --accent:#FF4D4D; --accent-600:#E63A3A; --accent-tint:#FDE5E5;
  --green:#7AA881; --slate:#597F92;
  --line:#E1E8EF; --line-2:#EDF1F6;
  --ok:#5E8C66; --warn:#C0892F; --danger:#E63A3A;
  --shadow:0 1px 2px rgba(23,36,48,.05), 0 8px 26px rgba(23,36,48,.07);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Hanken Grotesk',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
.mono{font-family:'JetBrains Mono',monospace}
.logo-img{display:block;height:52px;width:auto}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 520px at 84% -12%, rgba(255,77,77,.08), transparent 60%),
   radial-gradient(720px 620px at -5% 110%, rgba(28,76,124,.10), transparent 55%),var(--paper)}
.login-card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:34px 32px;box-shadow:var(--shadow);text-align:center}
.login-card .logo-img{height:74px;margin:0 auto 6px}
.login-card .lead{color:var(--muted);margin:14px 0 24px;font-size:14px}
.auth-field{text-align:left;margin-bottom:14px}
.auth-field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.auth-field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;transition:.15s}
.auth-field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(28,76,124,.12)}
.auth-err{background:var(--accent-tint);color:var(--accent-600);font-size:13px;font-weight:600;
  padding:10px 12px;border-radius:10px;margin-bottom:14px;text-align:left;display:none}
.auth-err.on{display:block}
.btn-block{width:100%;justify-content:center;padding:13px;font-size:15px}
.auth-toggle{margin-top:18px;font-size:14px;color:var(--muted)}
.auth-toggle button{color:var(--brand);font-weight:700}
.note{font-size:12px;color:var(--faint);margin-top:20px;line-height:1.55;text-align:left}
.mode-pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;margin-bottom:10px}
.mode-pill.local{background:#FFF4E0;color:#9A6B12}
.mode-pill.cloud{background:#E4F2E7;color:#3E6B47}
.demo-hint{background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);text-align:left;margin-top:14px;line-height:1.5}
.demo-hint code{background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}

.app{display:none;min-height:100vh}
.app.on{display:grid;grid-template-columns:250px 1fr}
.side{background:var(--brand);color:#E7EEF5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.10)}
.side .brand .chip{background:#fff;border-radius:12px;padding:9px 12px;display:inline-block}
.side .brand .chip .logo-img{height:40px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:10px;color:#BCCBD9;font-weight:600;font-size:14px;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.active{background:rgba(255,255,255,.13);color:#fff}
.nav .sect{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C97AF;padding:14px 13px 6px;font-weight:700}
.side .who{padding:14px;border-top:1px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:11px}
.side .who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:0 0 auto}
.side .who .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.2}
.side .who .rl{font-size:11px;color:#9CB2C6}
.side .who .out{margin-left:auto;color:#9CB2C6;padding:6px;border-radius:8px}
.side .who .out:hover{background:rgba(255,255,255,.1);color:#fff}

.main{padding:28px 36px 60px;max-width:1180px}
.mode-banner{background:#FFF4E0;border:1px solid #F3D89B;color:#8A5E10;border-radius:12px;padding:11px 15px;font-size:13px;margin-bottom:20px;display:flex;gap:10px;align-items:center}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:27px}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:4px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;border:1px solid transparent}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-600)}
.btn-dark{background:var(--brand);color:#fff}.btn-dark:hover{background:var(--brand-700)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--brand-300)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.stat{padding:18px 20px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.stat .v{font-family:'Bricolage Grotesque';font-weight:700;font-size:30px;margin-top:6px;letter-spacing:-.02em}

.timer-card{padding:30px;position:relative;overflow:hidden}
.timer-card::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 88% -30%, rgba(255,77,77,.07), transparent 70%);pointer-events:none}
.timer-display{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.clock{font-family:'JetBrains Mono';font-weight:700;font-size:62px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.clock.run{color:var(--accent)}
.clock.paused{color:var(--warn)}
.pulse{width:11px;height:11px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite;display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,77,.45)}70%{box-shadow:0 0 0 12px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
.timer-meta{color:var(--muted);font-size:14px;margin-top:8px}.timer-meta strong{color:var(--ink)}
.timer-form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.timer-form .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field select,.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
.field select:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,77,77,.12)}
.field select:disabled{background:var(--panel-2);color:var(--faint)}
.timer-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn-start{background:var(--accent);color:#fff;font-size:16px;padding:13px 26px;border-radius:12px;font-family:inherit;font-weight:600;cursor:pointer;border:none;transition:.15s}.btn-start:hover{background:var(--accent-600)}
.btn-stop{background:var(--brand);color:#fff;font-size:16px;padding:13px 26px;border-radius:12px;font-family:inherit;font-weight:600;cursor:pointer;border:none;transition:.15s}.btn-stop:hover{background:var(--brand-700)}
.btn-pause{background:#fff;border:2px solid var(--brand);color:var(--brand);font-size:16px;padding:11px 22px;border-radius:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s}.btn-pause:hover{background:var(--brand);color:#fff}
.btn-pause.paused{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-600)}.btn-pause.paused:hover{background:var(--accent);color:#fff}
.pause-badge{display:inline-flex;align-items:center;gap:6px;background:#FFF4E0;color:#9A6B12;border:1px solid #F3D89B;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;margin-top:6px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.toolbar .field{min-width:140px}.toolbar .field.sm{min-width:118px}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:var(--panel-2)}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--panel-2);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.dur{font-family:'JetBrains Mono';font-weight:700;font-variant-numeric:tabular-nums}
.row-act{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{padding:6px;border-radius:8px;color:var(--muted)}.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--accent-tint);color:var(--danger)}
.empty{text-align:center;color:var(--faint);padding:40px 0;font-size:14px}
.badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:20px;font-weight:700}
.badge.admin{background:var(--brand);color:#fff}.badge.user{background:var(--accent-tint);color:var(--accent-600)}

.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:160px 1fr 78px;align-items:center;gap:12px}
.bar-row .lbl{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:11px;background:var(--line-2);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:var(--brand);transition:width .5s}
.bar-row .val{font-family:'JetBrains Mono';font-weight:700;font-size:13px;text-align:right;color:var(--muted)}
.budget-row{padding:15px 0;border-bottom:1px solid var(--line-2)}.budget-row:last-child{border-bottom:none}
.budget-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.budget-top .nm{font-weight:700}.budget-top .cl{font-size:12px;color:var(--muted);margin-left:8px;font-weight:500}
.budget-top .pct{font-family:'JetBrains Mono';font-weight:700;font-size:13px}
.budget-track{height:9px;background:var(--line-2);border-radius:8px;overflow:hidden}
.budget-fill{height:100%;border-radius:8px;transition:width .5s}
.budget-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:11px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:480px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
.modal h2{font-size:20px;margin-bottom:18px}.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .field{margin-bottom:14px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:4px 0 14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:99;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:860px){
  .app.on{grid-template-columns:1fr}
  .side{position:fixed;z-index:40;width:250px;transform:translateX(-100%);transition:.25s}
  .side.open{transform:none}
  .main{padding:18px 14px 60px}
  .timer-form{grid-template-columns:1fr}.clock{font-size:44px}
  .bar-row{grid-template-columns:104px 1fr 62px}
  .grid[style*="repeat(3"],.grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}
  .menu-toggle{display:inline-flex!important}
}
.menu-toggle{display:none;position:fixed;top:14px;left:14px;z-index:45;background:var(--brand);color:#fff;width:42px;height:42px;border-radius:11px;align-items:center;justify-content:center;box-shadow:var(--shadow)}
</style>
</head>
<body>

<div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>

<div class="login-wrap" id="login" style="display:none">
  <div class="login-card">
    <img class="logo-img" id="loginLogo" alt="Stradi Consulting">
    <div id="modePill"></div>
    <p class="lead" id="authLead">Accédez à votre espace de suivi du temps.</p>
    <div class="auth-err" id="authErr"></div>
    <div class="auth-field" id="nameField" style="display:none">
      <label>Nom complet</label><input id="aName" placeholder="Prénom Nom" autocomplete="name">
    </div>
    <div class="auth-field"><label>Adresse e-mail</label><input id="aEmail" type="email" placeholder="vous@stradiconsulting.fr" autocomplete="email"></div>
    <div class="auth-field"><label>Mot de passe</label><input id="aPwd" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" id="authSubmit">Se connecter</button>
    <div class="auth-toggle" id="authToggle"></div>
    <div id="demoHint"></div>
    <p class="note" id="cfgNote"></p>
  </div>
</div>

<button class="menu-toggle" id="menuToggle">☰</button>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand" style="text-align:center;padding:18px 16px"><img id="sideLogo" alt="Stradi Consulting" style="height:80px;width:auto;border-radius:10px;display:block;margin:0 auto"></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main class="main" id="view"></main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

function avColor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return AV[h%AV.length];}
function initials(n){return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function msToClock(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
function minToHM(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h>0?(m>0?`${h}h${pad(m)}`:`${h}h`):`${m}min`;}
function msToHM(ms){return minToHM(ms/60000);}
function msToHours(ms){return (ms/3600000).toFixed(2);}
function fmtDate(ms){const d=new Date(ms);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function fmtTime(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function dateInputVal(ms){const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function timeInputVal(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function buildTs(ds,ts){return new Date(ds+'T'+(ts||'00:00')).getTime();}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36);}

const _mem={};
const Store={
  async get(k){if(window.storage){try{const r=await window.storage.get(k);return r?r.value:null}catch(e){return null}}
    try{return localStorage.getItem(k)}catch(e){return (k in _mem)?_mem[k]:null}},

};

function makeLocalApi(){
  async function persist(){await Store.set('stradi:db',JSON.stringify(DB));}
  return {
    mode:'local',
    async boot(onReady){
      const raw=await Store.get('stradi:db');
      if(raw){try{DB=JSON.parse(raw);}catch(e){DB=seed();await persist();}} else {DB=seed();await persist();}
      const s=await Store.get('stradi:session');
      if(s){try{session=JSON.parse(s);}catch(e){}}
      onReady();
    },
    async signIn(email,pwd){
      const u=DB.users.find(x=>x.email.toLowerCase()===email.toLowerCase());
      if(!u) return {error:"Aucun compte avec cet e-mail."};
      if(!u.active) return {error:"Compte désactivé."};
      if(u.pwd!==hash(pwd)) return {error:"Mot de passe incorrect."};
      session.userId=u.id;await Store.set('stradi:session',JSON.stringify(session));return {};
    },
    async signUp(name,email,pwd){
      if(DB.users.some(x=>x.email.toLowerCase()===email.toLowerCase())) return {error:"Un compte existe déjà avec cet e-mail."};
      const role=DB.users.length===0?'admin':'user';
      const u={id:uid('u'),name,email,role,active:true,pwd:hash(pwd)};
      DB.users.push(u);await persist();
      session.userId=u.id;await Store.set('stradi:session',JSON.stringify(session));return {};
    },
    async signOut(){session.userId=null;await Store.set('stradi:session',JSON.stringify(session));},
    async add(coll,data){const pre={clients:'c',projects:'p',tasks:'t',entries:'e',users:'u'}[coll];
      const rec={id:uid(pre),...data};DB[coll].push(rec);await persist();rerender();return rec.id;},
    async update(coll,id,patch){const r=DB[coll].find(x=>x.id===id);if(r)Object.assign(r,patch);await persist();rerender();},
    async remove(coll,id){DB[coll]=DB[coll].filter(x=>x.id!==id);await persist();rerender();},
    async setTimer(u,data){DB.timers[u]=data;await persist();rerender();},
    async clearTimer(u){delete DB.timers[u];await persist();rerender();}
  };
}

async function makeFirebaseApi(onAuth){
  const V='https://www.gstatic.com/firebasejs/10.12.0/';
  const {initializeApp}=await import(V+'firebase-app.js');
  const A=await import(V+'firebase-auth.js');
  const F=await import(V+'firebase-firestore.js');
  const app=initializeApp(firebaseConfig);
  const auth=A.getAuth(app);
  const db=F.getFirestore(app);
  await A.setPersistence(auth,A.browserLocalPersistence).catch(()=>{});
  function subscribe(){
    ['users','clients','projects','tasks','entries'].forEach(c=>{
      F.onSnapshot(F.collection(db,c),snap=>{DB[c]=snap.docs.map(d=>({id:d.id,...d.data()}));rerender();});
    });
    F.onSnapshot(F.collection(db,'timers'),snap=>{DB.timers={};snap.docs.forEach(d=>DB.timers[d.id]=d.data());rerender();});
  }
  A.onAuthStateChanged(auth,async u=>{
    if(u){
      session.userId=u.uid;
      const ref=F.doc(db,'users',u.uid);
      const ds=await F.getDoc(ref);
      if(!ds.exists()){
        const all=await F.getDocs(F.collection(db,'users'));
        const role=all.empty?'admin':'user';
        await F.setDoc(ref,{name:u.displayName||u.email.split('@')[0],email:u.email,role,active:true,createdAt:Date.now()});
      }
      subscribe();onAuth(true);
    } else {session.userId=null;onAuth(false);}
  });
  return {
    mode:'firebase',
    async boot(){},
    async signIn(email,pwd){try{await A.signInWithEmailAndPassword(auth,email,pwd);return {};}catch(e){return {error:fbErr(e)};}},
    async signUp(name,email,pwd){try{
        const cred=await A.createUserWithEmailAndPassword(auth,email,pwd);
        try{await A.updateProfile(cred.user,{displayName:name});}catch(e){}
        const all=await F.getDocs(F.collection(db,'users'));
        const role=all.empty?'admin':'user';
        await F.setDoc(F.doc(db,'users',cred.user.uid),{name,email,role,active:true,createdAt:Date.now()});
        return {};}catch(e){return {error:fbErr(e)};}},
    async signOut(){await A.signOut(auth);},
    async add(coll,data){await F.addDoc(F.collection(db,coll),data);},
    async update(coll,id,patch){await F.updateDoc(F.doc(db,coll,id),patch);},
    async remove(coll,id){await F.deleteDoc(F.doc(db,coll,id));},
    async setTimer(u,data){await F.setDoc(F.doc(db,'timers',u),data);},
    async clearTimer(u){await F.deleteDoc(F.doc(db,'timers',u));}
  };
}
function fbErr(e){const c=(e&&e.code)||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return "E-mail ou mot de passe incorrect.";
  if(c.includes('email-already-in-use')) return "Un compte existe déjà avec cet e-mail.";
  if(c.includes('weak-password')) return "Mot de passe trop court (6 caractères minimum).";
  if(c.includes('invalid-email')) return "Adresse e-mail invalide.";
  return "Erreur : "+(e.message||c);}

function startTick(){
  stopTick();
  const t=activeTimer();if(!t)return;
  if(pauseStart) return; // en pause : on ne tick pas
  const upd=()=>{
    const el=$('#clock');if(!el)return;
    const elapsed=Date.now()-t.start-(t.pausedTotal||0);
    el.textContent=msToClock(Math.max(0,elapsed));
  };
  upd();tickHandle=setInterval(upd,1000);
}

// ── PAUSE ──────────────────────────────────────────────────────────────────
async function pauseTimer(){
  const t=activeTimer();if(!t)return;
  if(pauseStart){
    // Reprendre : comptabiliser la durée de cette pause
    const pauseDur=Date.now()-pauseStart;
    const total=(t.pausedTotal||0)+pauseDur;
    pauseStart=null;
    await api.setTimer(session.userId,{...t,pausedTotal:total});
    startTick();
  } else {
    // Mettre en pause
    pauseStart=Date.now();
    stopTick();
  }
  renderTimer();
}

async function stopTimerSilent(){
  const t=activeTimer();if(!t)return;
  // Clore la pause en cours si applicable
  let totalPaused=(t.pausedTotal||0);
  if(pauseStart){totalPaused+=Date.now()-pauseStart;pauseStart=null;}
  const end=Date.now();
  const realMs=end-t.start-totalPaused;
  if(realMs>=1000) await api.add('entries',{userId:session.userId,clientId:t.clientId,projectId:t.projectId,taskId:t.taskId,start:t.start,end:t.start+realMs,note:t.note||''});
  await api.clearTimer(session.userId);
}
async function stopTimer(){
  const t=activeTimer();if(!t)return;
  await stopTimerSilent();
  state._tClient=t.clientId;state._tProject=t.projectId;state._tTask='';
  toast('Pointage enregistré.');
}

function periodRange(){
  const now=new Date();let from;
  if(state.period==='day'){from=new Date(now);from.setHours(0,0,0,0);}
  else if(state.period==='week'){from=new Date(now);const d=(from.getDay()+6)%7;from.setDate(from.getDate()-d);from.setHours(0,0,0,0);}
  else if(state.period==='month'){from=new Date(now.getFullYear(),now.getMonth(),1);}
  else from=new Date(0);
  return [from.getTime(),Date.now()];
}
function renderReports(){
  const [from,to]=periodRange();
  const list=DB.entries.filter(e=>e.start>=from&&e.start<=to);
  const total=list.reduce((s,e)=>s+(e.end-e.start),0);
  const people=new Set(list.map(e=>e.userId)).size;
  const labels={day:"Aujourd'hui",week:'Cette semaine',month:'Ce mois-ci',all:"Tout l'historique"};
  const byKey=(kf,nf)=>{const m={};list.forEach(e=>{const k=kf(e);m[k]=(m[k]||0)+(e.end-e.start);});
    return Object.entries(m).map(([k,ms])=>({label:nf(k),ms})).sort((a,b)=>b.ms-a.ms);};
  $('#view').innerHTML=`${modeBanner()}
  <div class="page-head"><div><h1>Rapports</h1><div class="sub">Prévu vs réalisé, par projet, personne et client.</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${['day','week','month','all'].map(p=>`<button class="btn ${state.period===p?'btn-dark':'btn-ghost'} btn-sm" data-action="period" data-p="${p}">${labels[p]}</button>`).join('')}</div></div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
    <div class="panel stat"><div class="k">Temps total · ${labels[state.period]}</div><div class="v">${msToHM(total)}</div></div>
    <div class="panel stat"><div class="k">Pointages</div><div class="v">${list.length}</div></div>
    <div class="panel stat"><div class="k">Collaborateurs actifs</div><div class="v">${people}</div></div></div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:18px">
    <div class="panel" style="padding:22px"><div class="section-title">Prévu vs réalisé (par projet)</div>${renderBudgets()}</div>
    <div class="panel" style="padding:22px"><div class="section-title">Temps par projet</div>${renderBars(byKey(e=>e.projectId,projectName))}</div></div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="panel" style="padding:22px"><div class="section-title">Temps par personne</div>${renderBars(byKey(e=>e.userId,userName))}</div>
    <div class="panel" style="padding:22px"><div class="section-title">Temps par client</div>${renderBars(byKey(e=>e.clientId,clientName))}</div></div>`;
}
function renderBars(rows){
  if(!rows.length) return `<div class="empty">Aucune donnée sur la période.</div>`;
  const max=Math.max(...rows.map(r=>r.ms))||1;
  return `<div class="bars">${rows.map(r=>`<div class="bar-row">
    <span class="lbl" title="${esc(r.label)}">${esc(r.label)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${Math.max(4,r.ms/max*100)}%"></span></span>
    <span class="val">${msToHM(r.ms)}</span></div>`).join('')}</div>`;
}
function renderBudgets(){
  const projs=DB.projects.filter(p=>p.budget>0);
  if(!projs.length) return `<div class="empty">Aucun budget de temps défini.</div>`;
  return projs.map(p=>{
    const ms=DB.entries.filter(e=>e.projectId===p.id).reduce((s,e)=>s+(e.end-e.start),0);
    const min=ms/60000,ratio=min/p.budget*100,pct=Math.min(100,ratio),over=min>p.budget;
    const color=over?'var(--danger)':(ratio>85?'var(--warn)':'var(--ok)'),reste=p.budget-min;
    return `<div class="budget-row"><div class="budget-top">
        <span><span class="nm">${esc(p.name)}</span><span class="cl">${esc(clientName(p.clientId))}</span></span>
        <span class="pct" style="color:${color}">${Math.round(ratio)}%</span></div>
      <div class="budget-track"><div class="budget-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="budget-foot"><span>Réalisé ${minToHM(min)} / Prévu ${minToHM(p.budget)}</span>
        <span style="color:${over?'var(--danger)':'var(--muted)'}">${over?'Dépassement '+minToHM(-reste):'Reste '+minToHM(reste)}</span></div></div>`;
  }).join('');
}

function exportCSV(){const rows=exportRows();if(!rows.length){toast('Aucune donnée à exporter.');return;}

  doc.autoTable({startY:116,head:[['Date','Personne','Client','Projet','Tâche','Début','Fin','Durée (h)','Note']],

    headStyles:{fillColor:[28,76,124],textColor:[255,255,255],fontStyle:'bold'},

  doc.save(`stradi-rapport-${dateInputVal(Date.now())}.pdf`);toast('Export PDF généré.');}
function downloadBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

document.addEventListener('click',e=>{

  const a=el.dataset.action,id=el.dataset.id;
  switch(a){

    case 'saveEntry':saveEntry(id);break;
    case 'clearFilters':clearFilters();break;
    case 'exportCSV':exportCSV();break;
    case 'exportPDF':exportPDF();break;
    case 'period':state.period=el.dataset.p;renderReports();break;
    case 'adminTab':state.adminTab=el.dataset.tab;renderAdmin();break;
    case 'clientModal':clientModal(id);break;
    case 'saveClient':saveClient(id);break;
    case 'delClient':delClient(id);break;
    case 'projectModal':projectModal(id);break;
    case 'saveProject':saveProject(id);break;
    case 'delProject':delProject(id);break;
    case 'taskModal':taskModal(id);break;
    case 'saveTask':saveTask(id);break;
    case 'delTask':delTask(id);break;
    case 'userModal':userModal(id);break;
    case 'saveUser':saveUser(id);break;
    case 'delUser':delUser(id);break;
    case 'closeModal':closeModal();break;
  }
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  if(a==='tselect')onTimerSelect(el.dataset.lvl,el.value);
  else if(a==='filter')setFilter(el.dataset.key,el.value);
  else if(a==='mclient')mCascadeClient();
  else if(a==='mproject')mCascadeProject();});
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
$('#authSubmit').addEventListener('click',submitAuth);
$('#aPwd').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();});
$('#aEmail').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();});
$('#menuToggle').addEventListener('click',()=>$('#side').classList.toggle('open'));

(async function(){
  try{
    if(FIREBASE_READY){
      api=await makeFirebaseApi(signedIn=>{ if(signedIn) enterApp(); else showLogin(); });
    }else{
      api=makeLocalApi();
      await api.boot(()=>{
        if(session.userId && DB.users.some(u=>u.id===session.userId && u.active)) enterApp();
        else showLogin();
      });
    }
  }catch(err){
    console.error(err);
    api=makeLocalApi();
    await api.boot(()=>{});
    showLogin();
    const e=$('#authErr');e.textContent="Firebase n'a pas pu démarrer ; vérifiez la configuration. (Mode démo disponible.)";e.classList.add('on');
  }
})();
</script>
